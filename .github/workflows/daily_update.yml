name: MisterBet Daily Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write  # ← QUESTA RIGA È LA CHIAVE! Dà i permessi di scrittura

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # ← Aggiornato a v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5  # ← Aggiornato a v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Fetch Live Odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python backend/services/fetch_live_odds.py

      - name: Generate App Data
        run: python backend/services/generate_app_data.py

      - name: Copy data to frontend
        run: cp backend/data/app_data.json frontend/app_data.json

      - name: Commit and Push changes
        run: |
          git config --global user.name 'MisterBet Bot'
          git config --global user.email 'bot@misterbet.com'
          git add frontend/app_data.json
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Aggiornamento automatico dati giornaliero"
            git pull --rebase origin main
            git push origin main
          )