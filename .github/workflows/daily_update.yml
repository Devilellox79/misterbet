name: MisterBet Daily Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Fetch Live Odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python backend/services/fetch_live_odds.py

      - name: Generate App Data
        run: python backend/services/generate_app_data.py

      - name: Update file via GitHub API
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Codifica il file in base64
          CONTENT=$(base64 -w 0 frontend/app_data.json)
          
          # Ottieni lo SHA del file corrente (necessario per l'update)
          SHA=$(curl -s -H "Authorization: token $PAT_TOKEN" \
            "https://api.github.com/repos/$REPO/contents/frontend/app_data.json" \
            | jq -r '.sha')
          
          # Aggiorna il file via API
          curl -X PUT \
            -H "Authorization: token $PAT_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/contents/frontend/app_data.json \
            -d "{
              \"message\": \"Aggiornamento automatico dati giornaliero\",
              \"content\": \"$CONTENT\",
              \"sha\": \"$SHA\",
              \"branch\": \"main\",
              \"committer\": {
                \"name\": \"MisterBet Bot\",
                \"email\": \"bot@misterbet.com\"
              }
            }"
          
          echo "✅ File aggiornato via API GitHub"