name: MisterBet Daily Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Fetch Live Odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python backend/services/fetch_live_odds.py

      - name: Generate App Data
        run: python backend/services/generate_app_data.py

      - name: Copy data to frontend
        run: cp backend/data/app_data.json frontend/app_data.json

      - name: Commit and Push changes
        run: |
          git config --global user.name 'MisterBet Bot'
          git config --global user.email 'bot@misterbet.com'
          git add frontend/app_data.json
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento automatico dati giornaliero"
            git pull --rebase origin main --autostash
            git push origin main
          else
            echo "Nessun cambiamento da committare"
          fi